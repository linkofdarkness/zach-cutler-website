name: Capture Documentation Screenshots

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Comma-separated list of page paths (e.g., home,about,blog)'
        required: false
        default: ''
      capture_dark_mode:
        description: 'Capture dark mode screenshots'
        type: boolean
        required: true
        default: true

  schedule:
    # Run daily at 2 AM UTC for automated review captures
    - cron: '0 2 * * *'

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
      
      - name: Build documentation site
        working-directory: ./site
        run: npm run build
      
      - name: Capture screenshots
        working-directory: ./site
        env:
          PAGES_INPUT: ${{ github.event.inputs.pages || 'home,about,blog' }}
          DARK_MODE_INPUT: ${{ github.event.inputs.capture_dark_mode == true && '--dark' || '' }}
        run: |
          pages="${PAGES_INPUT:-home,about,blog}"
          dark_flag=""
          if [ "${{ github.event.inputs.capture_dark_mode }}" = "true" ]; then
            dark_flag="--dark"  # Enable dark mode screenshots
          fi
          
          echo "📸 Capturing screenshots for: $pages"
          npm run capture-screenshots -- --pages "$pages" $dark_flag
      
      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots-${{ github.run_number }}
          path: site/static/screenshot-reviews/
          retention-days: 30
      
      - name: Generate PR if changes detected
        run: |
          # This would create a PR or comment based on screenshot differences
          # For now, just log the results
          echo "📊 Screenshot review artifacts uploaded"
