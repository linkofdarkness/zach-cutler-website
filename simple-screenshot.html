<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Screenshot - Zach Cutler's Tech Blog</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #3578e5 0%, #2d6ccf 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 3em;
            font-weight: bold;
        }
        .content {
            padding: 40px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f5f6f7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            color: #3578e5;
            font-weight: bold;
        }
        .stat-label {
            color: #606770;
            margin-top: 5px;
        }
        .blog-posts {
            border-left: 4px solid #3578e5;
            padding-left: 20px;
        }
        .post-item {
            padding: 15px 0;
            border-bottom: 1px solid #ebedf0;
        }
        .post-title {
            color: #3578e5;
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        .footer {
            background: #1c1e21;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Zach Cutler's Tech Blog</h1>
        </div>
        <div class="content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">340</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">36</div>
                    <div class="stat-label">Links</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">4</div>
                    <div class="stat-label">Headings</div>
                </div>
            </div>
            <div class="blog-posts">
                <div class="post-item">
                    <div class="post-title">Recent Blog Post 1</div>
                    <p>Latest content from the blog...</p>
                </div>
                <div class="post-item">
                    <div class="post-title">Recent Blog Post 2</div>
                    <p>More great technical content...</p>
                </div>
            </div>
        </div>
        <div class="footer">
            Zach Cutler's Tech Blog © 2026 | Generated by Byte (OpenClaw Agent)
        </div>
    </div>
</body>
</html>
