<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3578e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6ccf;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f6f7"/>
  
  <!-- Browser Chrome -->
  <rect width="1200" height="40" fill="#d9dde0" filter="url(#shadow)"/>
  <circle cx="30" cy="20" r="8" fill="#ff5f57"/>
  <circle cx="50" cy="20" r="8" fill="#febc2e"/>
  <circle cx="70" cy="20" r="8" fill="#28ca41"/>
  
  <!-- URL Bar -->
  <rect x="100" y="10" width="600" height="20" rx="10" fill="#ffffff" stroke="#d9dde0" stroke-width="1"/>
  <text x="115" y="24" font-family="Arial, sans-serif" font-size="12" fill="#666">https://zachcutler.me/blog/</text>
  
  <!-- Page Header -->
  <rect width="1200" height="80" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff">Zach Cutler's Tech Blog</text>
  
  <!-- Main Content Area -->
  <rect x="80" y="100" width="1040" height="600" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Statistics Cards -->
  <g transform="translate(120, 150)">
    <rect x="0" y="0" width="300" height="120" rx="8" ry="8" fill="#f5f6f7"/>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#3578e5">340</text>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#606770">Words</text>
  </g>
  
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="300" height="120" rx="8" ry="8" fill="#f5f6f7"/>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#3578e5">36</text>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#606770">Links</text>
  </g>
  
  <g transform="translate(840, 150)">
    <rect x="0" y="0" width="300" height="120" rx="8" ry="8" fill="#f5f6f7"/>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#3578e5">4</text>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#606770">Headings</text>
  </g>
  
  <!-- Blog Post Preview -->
  <rect x="120" y="300" width="960" height="400" fill="#fafafa"/>
  <line x1="120" y1="350" x2="1080" y2="350" stroke="#ebedf0" stroke-width="2"/>
  
  <!-- Recent Posts -->
  <g transform="translate(160, 370)">
    <rect width="880" height="80" fill="white" rx="4" ry="4"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3578e5">• Recent Blog Post 1</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" fill="#606770">Latest technical content and tutorials...</text>
  </g>
  
  <g transform="translate(160, 480)">
    <rect width="880" height="80" fill="white" rx="4" ry="4"/>
    <line x1="20" y1="75" x2="860" y2="75" stroke="#ebedf0" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3578e5">• Recent Blog Post 2</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" fill="#606770">More great technical insights...</text>
  </g>
  
  <!-- Footer -->
  <rect x="80" y="700" width="1040" height="60" fill="#1c1e21"/>
  <text x="600" y="735" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">Zach Cutler's Tech Blog © 2026</text>
  
  <!-- Generated by Byte -->
  <text x="600" y="785" font-family="monospace" font-size="10" text-anchor="middle" fill="#8d949e">Generated by Byte (OpenClaw Agent) - 2026-05-07</text>
  
  <!-- Badge -->
  <g transform="translate(1000, 30)">
    <rect width="180" height="40" rx="20" ry="20" fill="#3578e5"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">🎨 SVG Screenshot</text>
  </g>
</svg>
