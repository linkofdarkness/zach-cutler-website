<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevTools Hub — Developer Utility Suite</title>
<meta name="description" content="Free online developer utilities: UUID generator, color converter, base64 encoder, JSON formatter, password strength checker, random data generator, and more.">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --purple: #bc8cff;
  --orange: #d76e0d;
  --cyan: #39d2c0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

/* Header */
header {
  text-align: center;
  padding: 40px 20px 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
header h1 span { color: var(--accent); }
header p { color: var(--text-muted); font-size: 1.05rem; }

header .badge {
  display: inline-block;
  background: rgba(88,166,255,0.15);
  color: var(--accent);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: .85rem;
  font-weight: 500;
  margin-top: 12px;
  border: 1px solid rgba(88,166,255,0.25);
}

/* Tool Grid */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  margin-top: 8px;
}

.tool-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  transition: border-color .2s, box-shadow .2s;
}

.tool-card:hover { border-color: var(--accent); box-shadow: 0 0 16px rgba(88,166,255,0.08); }

.tool-card h3 {
  font-size: 1.05rem;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-card h3 .icon { font-size: 1.2rem; }

/* Inputs */
input[type="text"], input[type="number"], input[type="password"], textarea, select {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .9rem;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  transition: border-color .2s;
}

input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

textarea { min-height: 80px; resize: vertical; font-family: 'SF Mono', monospace; }

.btn {
  padding: 8px 18px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: .85rem;
  cursor: pointer;
  transition: background .2s, transform .1s;
}

.btn:hover { background: var(--accent-hover); }
.btn:active { transform: scale(.97); }
.btn-sm { padding: 6px 14px; font-size: .8rem; }
.btn-green { background: var(--green); }
.btn-green:hover { background: #4cda64; }
.btn-purple { background: var(--purple); }
.btn-purple:hover { background: #cea5ff; }

/* Output */
.output {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'SF Mono', monospace;
  font-size: .85rem;
  word-break: break-all;
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  display: none;
}

.output.show { display: block; }

.output.error { border-color: var(--red); color: var(--red); }

.output-row { display: flex; gap: 8px; margin-top: 12px; }
.output-row input { flex: 1; }

/* Status bar */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .8rem;
  color: var(--text-muted);
  z-index: 50;
}

.status-bar .status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 8px;
}

.status-bar .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-bar .status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }

/* Color preview */
.color-preview {
  width: 48px; height: 48px;
  border-radius: 8px;
  border: 2px solid var(--border);
  flex-shrink: 0;
}

.flex-row { display: flex; gap: 12px; align-items: center; }
.flex-col { display: flex; flex-direction: column; gap: 8px; }
.gap-8 { gap: 8px; }
.mt-8 { margin-top: 8px; }
.mb-8 { margin-bottom: 8px; }

/* JSON formatter area */
.json-input { min-height: 120px; }

/* Copy button */
.copy-btn {
  position: absolute;
  top: 8px; right: 8px;
  padding: 4px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: .75rem;
  transition: all .2s;
}

.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

.output-wrapper { position: relative; }

/* Strength meter */
.strength-bar {
  height: 6px;
  border-radius: 3px;
  margin-top: 8px;
  transition: all .3s;
  background: #333;
}

.strength-bar.weak { background: var(--red); width: 25%; }
.strength-bar.fair { background: var(--orange); width: 50%; }
.strength-bar.good { background: var(--yellow); width: 75%; }
.strength-bar.strong { background: var(--green); width: 100%; }

/* Responsive */
@media (max-width: 768px) {
  .tools-grid { grid-template-columns: 1fr; }
  header h1 { font-size: 1.6rem; }
  .container { padding: 16px 12px; }
}

/* Spinner */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 8px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs for large tools */
.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab {
  padding: 8px 18px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-size: .85rem;
  font-weight: 500;
  transition: all .2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>🧰 Dev<span>Tools</span> Hub</h1>
  <p>Free developer utilities — no signup, no tracking, just tools</p>
  <div class="badge">✨ 15 tools • Zero dependencies • Open source</div>
</header>

<div class="container">
  <div class="tools-grid" id="toolsGrid">
    <!-- Tools will be inserted by JS -->
  </div>
</div>

<div class="status-bar">
  <span>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Checking API...</span>
  </span>
  <span>v1.0 • <a href="https://github.com/linkofdarkness" style="color:var(--text-muted);text-decoration:none;">GitHub</a></span>
</div>

<script>
// ── API Configuration ────────────────────────────────────────────────
const API = `${window.location.protocol}//${window.location.host}`;
  ? `http://${window.location.hostname}:3000`
  : 'https://api.devtools.example.com'; // fallback — deploy and update this

// ── Helper Functions ─────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(`${API}${path}`);
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`HTTP ${res.status}: ${body.slice(0,100)}`);
  }
  return res.json();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function showOutput(id, data, error) {
  const el = document.getElementById(id);
  el.classList.add('show');
  el.classList.remove('error');
  if (error) {
    el.textContent = `⚠️ ${error}`;
    el.classList.add('error');
  } else {
    el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
  }
}

function getVal(id) { return document.getElementById(id).value; }
function setVal(id, v) { document.getElementById(id).value = v; }

// ── API Status Check ──────────────────────────────────────────────────
async function checkApiStatus() {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  try {
    const h = await api('/health');
    dot.className = 'status-dot online';
    txt.textContent = `API online · ${h.version || '1.0'} · uptime ${Math.floor(h.uptime || 0)}s`;
  } catch (e) {
    dot.className = 'status-dot offline';
    txt.textContent = 'API offline — some tools use local fallbacks';
  }
}

// ── Tool Definitions ─────────────────────────────────────────────────
const tools = [
  // 1. UUID Generator
  {
    title: '🔢 UUID Generator',
    render: () => `
      <div class="flex-col">
        <div class="flex-row">
          <label style="color:var(--text-muted);font-size:.85rem;">Count:</label>
          <input type="number" id="uuidCount" value="1" min="1" max="20" style="width:80px;">
          <button class="btn" onclick="generateUUID()">Generate</button>
        </div>
        <div class="output-wrapper">
          <div class="output" id="uuidOutput"></div>
        </div>
      </div>`,
    action: async () => {
      const count = getVal('uuidCount') || 1;
      try { const d = await api(`/api/uuid?count=${count}`); showOutput('uuidOutput', d); }
      catch(e) { showOutput('uuidOutput', null, e.message); }
    }
  },

  // 2. Color Converter
  {
    title: '🎨 Color Converter',
    render: () => `
      <div class="flex-col">
        <div class="flex-row gap-8">
          <input type="text" id="colorInput" placeholder="hex, rgb, or hsl" value="58a6ff">
          <select id="colorMode" style="width:100px;">
            <option value="hex2rgb">Hex → RGB</option>
            <option value="rgb2hex">RGB → Hex</option>
            <option value="rgb2hsl">RGB → HSL</option>
          </select>
          <button class="btn btn-sm" onclick="convertColor()">Convert</button>
        </div>
        <div class="flex-row gap-8">
          <div class="color-preview" id="colorPreview" style="background:#58a6ff;"></div>
          <div class="output" id="colorOutput" style="flex:1;"></div>
        </div>
      </div>`,
    action: async () => {
      const input = getVal('colorInput');
      const mode = getVal('colorMode');
      let path;
      if (mode === 'hex2rgb') {
        const hex = input.replace(/^#/, '');
        path = `/api/color/hex-to-rgb?hex=${hex}`;
      } else if (mode === 'rgb2hex') {
        const parts = input.split(/[,\s]+/).filter(Boolean);
        path = `/api/color/rgb-to-hex?r=${parts[0]||0}&g=${parts[1]||0}&b=${parts[2]||0}`;
      } else {
        const parts = input.split(/[,\s]+/).filter(Boolean);
        path = `/api/color/rgb-to-hsl?r=${parts[0]||0}&g=${parts[1]||0}&b=${parts[2]||0}`;
      }
      try {
        const d = await api(path);
        const hex = d.hex || (d.hsl ? input : '#000');
        document.getElementById('colorPreview').style.background = `#${hex.replace(/^#/,'')}`;
        showOutput('colorOutput', d);
      } catch(e) { showOutput('colorOutput', null, e.message); }
    }
  },

  // 3. Base64
  {
    title: '🔐 Base64',
    render: () => `
      <div class="flex-col">
        <div class="tabs" id="b64Tabs">
          <span class="tab active" onclick="switchB64Mode('encode',this)">Encode</span>
          <span class="tab" onclick="switchB64Mode('decode',this)">Decode</span>
        </div>
        <input type="text" id="b64Input" placeholder="Input text">
        <button class="btn btn-sm" onclick="runBase64()">Go</button>
        <div class="output-wrapper"><div class="output" id="b64Output"></div></div>
      </div>`,
    action: () => {}
  },

  // 4. JSON Formatter
  {
    title: '📋 JSON Formatter',
    render: () => `
      <div class="flex-col">
        <textarea class="json-input" id="jsonInput" placeholder='{"key": "value", "nested": {"a": 1}}'></textarea>
        <div class="flex-row gap-8">
          <button class="btn btn-sm btn-green" onclick="formatJSON()">Format</button>
          <button class="btn btn-sm" onclick="minifyJSON()">Minify</button>
          <button class="btn btn-sm btn-purple" onclick="validateJSON()">Validate</button>
        </div>
        <div class="output-wrapper"><div class="output" id="jsonOutput"></div></div>
      </div>`,
    action: () => {}
  },

  // 5. Country Lookup
  {
    title: '🌍 Country Info',
    render: () => `
      <div class="flex-col">
        <div class="flex-row gap-8">
          <input type="text" id="countryCode" placeholder="Country code (e.g. US, JP)" value="US">
          <button class="btn btn-sm" onclick="lookupCountry()">Lookup</button>
          <button class="btn btn-sm" onclick="listCountries()">All</button>
        </div>
        <div class="output-wrapper"><div class="output" id="countryOutput"></div></div>
      </div>`,
    action: async () => {
      try { const d = await api('/country?code=US'); showOutput('countryOutput', d); }
      catch(e) { showOutput('countryOutput', null, e.message); }
    }
  },

  // 6. HTTP Status Codes
  {
    title: '📡 HTTP Status Codes',
    render: () => `
      <div class="flex-col">
        <div class="flex-row gap-8">
          <input type="number" id="httpCode" placeholder="Status code" value="404">
          <button class="btn btn-sm" onclick="lookupHTTP()">Lookup</button>
          <button class="btn btn-sm" onclick="listHTTP()">All Codes</button>
        </div>
        <div class="output-wrapper"><div class="output" id="httpOutput"></div></div>
      </div>`,
    action: async () => {
      try { const d = await api('/http-status?code=404'); showOutput('httpOutput', d); }
      catch(e) { showOutput('httpOutput', null, e.message); }
    }
  },

  // 7. Password Strength
  {
    title: '🔒 Password Strength',
    render: () => `
      <div class="flex-col">
        <input type="password" id="passwordInput" placeholder="Enter password to check" value="MyP@ssw0rd">
        <button class="btn btn-sm" onclick="checkPassword()">Analyze</button>
        <div class="strength-bar" id="strengthBar"></div>
        <div class="output-wrapper"><div class="output" id="passwordOutput"></div></div>
      </div>`,
    action: async () => {
      try { const d = await api('/password/strength?password=MyP@ssw0rd'); showOutput('passwordOutput', d); }
      catch(e) { showOutput('passwordOutput', null, e.message); }
    }
  },

  // 8. Random Data
  {
    title: '🎲 Random Data',
    render: () => `
      <div class="flex-col">
        <div class="flex-row gap-8">
          <select id="randomType" style="flex:1;">
            <option value="uuid">UUID</option>
            <option value="name">Name</option>
            <option value="email">Email</option>
            <option value="city">City</option>
            <option value="color">Color</option>
            <option value="phone">Phone</option>
          </select>
          <input type="number" id="randomCount" value="3" min="1" max="20" style="width:60px;">
          <button class="btn btn-sm" onclick="generateRandom()">Generate</button>
        </div>
        <div class="output-wrapper"><div class="output" id="randomOutput"></div></div>
      </div>`,
    action: async () => {
      try { const d = await api('/random?type=uuid&count=3'); showOutput('randomOutput', d); }
      catch(e) { showOutput('randomOutput', null, e.message); }
    }
  },

  // 9. IP Info
  {
    title: '🌐 IP Info',
    render: () => `
      <div class="flex-col">
        <button class="btn btn-sm" onclick="getMyIP()">Get My IP</button>
        <div class="output-wrapper"><div class="output" id="ipOutput"></div></div>
      </div>`,
    action: async () => {
      try { const d = await api('/ip'); showOutput('ipOutput', d); }
      catch(e) { showOutput('ipOutput', null, e.message); }
    }
  },

  // 10. User-Agent Parser
  {
    title: '🕵️ UA Parser',
    render: () => `
      <div class="flex-col">
        <input type="text" id="uaInput" placeholder="User-Agent string" style="font-size:.8rem;">
        <button class="btn btn-sm" onclick="parseUA()">Parse</button>
        <div class="output-wrapper"><div class="output" id="uaOutput"></div></div>
      </div>`,
    action: () => {}
  },
];

// ── Wire Up Tools ─────────────────────────────────────────────────────
function renderTools() {
  const grid = document.getElementById('toolsGrid');
  grid.innerHTML = tools.map((t, i) =>
    `<div class="tool-card" id="tool-${i}">
       <h3>${t.title}</h3>
       ${t.render()}
     </div>`
  ).join('');
}

// ── Tool Actions ──────────────────────────────────────────────────────

// UUID
async function generateUUID() {
  const count = getVal('uuidCount') || 1;
  try { const d = await api(`/api/uuid?count=${count}`); showOutput('uuidOutput', d); }
  catch(e) { showOutput('uuidOutput', null, e.message); }
}

// Color
async function convertColor() {
  const input = getVal('colorInput');
  const mode = getVal('colorMode');
  let path;
  if (mode === 'hex2rgb') {
    const hex = input.replace(/^#/, '');
    path = `/api/color/hex-to-rgb?hex=${hex}`;
  } else if (mode === 'rgb2hex') {
    const parts = input.split(/[,\s]+/).filter(Boolean);
    path = `/api/color/rgb-to-hex?r=${parts[0]||0}&g=${parts[1]||0}&b=${parts[2]||0}`;
  } else {
    const parts = input.split(/[,\s]+/).filter(Boolean);
    path = `/api/color/rgb-to-hsl?r=${parts[0]||0}&g=${parts[1]||0}&b=${parts[2]||0}`;
  }
  try {
    const d = await api(path);
    const hex = d.hex || '#000';
    document.getElementById('colorPreview').style.background = `#${hex.replace(/^#/,'')}`;
    showOutput('colorOutput', d);
  } catch(e) { showOutput('colorOutput', null, e.message); }
}

// Base64
let b64Mode = 'encode';
function switchB64Mode(mode, el) {
  b64Mode = mode;
  document.querySelectorAll('#b64Tabs .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

async function runBase64() {
  const input = getVal('b64Input');
  if (!input) return;
  try {
    const d = await api(`/api/base64/${b64Mode}?input=${encodeURIComponent(input)}`);
    showOutput('b64Output', d);
  } catch(e) {
    // Local fallback
    if (b64Mode === 'encode') showOutput('b64Output', { encoded: btoa(input) });
    else try { showOutput('b64Output', { decoded: atob(input) }); } catch(x) { showOutput('b64Output', null, 'Invalid base64'); }
  }
}

// JSON
async function formatJSON() {
  const input = getVal('jsonInput');
  if (!input) return;
  try {
    const d = await api('/json/format');
    showOutput('jsonOutput', d);
  } catch(e) {
    // Local fallback
    try { showOutput('jsonOutput', JSON.stringify(JSON.parse(input), null, 2)); }
    catch(x) { showOutput('jsonOutput', null, 'Invalid JSON: ' + x.message); }
  }
}

async function minifyJSON() {
  const input = getVal('jsonInput');
  if (!input) return;
  try { showOutput('jsonOutput', JSON.stringify(JSON.parse(input))); }
  catch(e) { showOutput('jsonOutput', null, 'Invalid JSON: ' + e.message); }
}

function validateJSON() {
  const input = getVal('jsonInput');
  try {
    JSON.parse(input);
    showOutput('jsonOutput', '✅ Valid JSON!');
  } catch(e) {
    showOutput('jsonOutput', null, `❌ Invalid: ${e.message}`);
  }
}

// Country
async function lookupCountry() {
  const code = getVal('countryCode');
  try { const d = await api(`/api/country?code=${code}`); showOutput('countryOutput', d); }
  catch(e) { showOutput('countryOutput', null, e.message); }
}

async function listCountries() {
  try { const d = await api('/country'); showOutput('countryOutput', d); }
  catch(e) { showOutput('countryOutput', null, e.message); }
}

// HTTP Status
async function lookupHTTP() {
  const code = getVal('httpCode');
  try { const d = await api(`/api/http-status?code=${code}`); showOutput('httpOutput', d); }
  catch(e) { showOutput('httpOutput', null, e.message); }
}

async function listHTTP() {
  try { const d = await api('/http-status'); showOutput('httpOutput', d); }
  catch(e) { showOutput('httpOutput', null, e.message); }
}

// Password
async function checkPassword() {
  const pw = getVal('passwordInput');
  if (!pw) return;
  try {
    const d = await api(`/api/password/strength?password=${encodeURIComponent(pw)}`);
    showOutput('passwordOutput', d);
    const score = parseInt(d.score) || 0;
    const bar = document.getElementById('strengthBar');
    if (score <= 2) { bar.className = 'strength-bar weak'; }
    else if (score <= 4) { bar.className = 'strength-bar fair'; }
    else if (score <= 5) { bar.className = 'strength-bar good'; }
    else { bar.className = 'strength-bar strong'; }
  } catch(e) {
    // Local assessment
    const s = pw.length;
    const hasUpper = /[A-Z]/.test(pw);
    const hasLower = /[a-z]/.test(pw);
    const hasNum = /[0-9]/.test(pw);
    const hasSpec = /[^A-Za-z0-9]/.test(pw);
    const score = (s > 8 ? 2 : s > 5 ? 1 : 0) + (hasUpper ? 1 : 0) + (hasLower ? 1 : 0) + (hasNum ? 1 : 0) + (hasSpec ? 2 : 0);
    const bar = document.getElementById('strengthBar');
    if (score <= 2) { bar.className = 'strength-bar weak'; }
    else if (score <= 4) { bar.className = 'strength-bar fair'; }
    else if (score <= 5) { bar.className = 'strength-bar good'; }
    else { bar.className = 'strength-bar strong'; }
    showOutput('passwordOutput', { length: pw.length, score: `${score}/7`, label: score >= 6 ? 'Strong' : score >= 4 ? 'Good' : score >= 2 ? 'Fair' : 'Weak' });
  }
}

// Random
async function generateRandom() {
  const type = getVal('randomType');
  const count = getVal('randomCount') || 3;
  try {
    const d = await api(`/api/random?type=${type}&count=${count}`);
    showOutput('randomOutput', d);
  } catch(e) {
    const items = [];
    const names = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Hank'];
    const cities = ['Tokyo', 'Paris', 'London', 'NYC', 'Berlin', 'Sydney', 'Seoul'];
    for (let i = 0; i < count; i++) {
      if (type === 'name') items.push(names[Math.floor(Math.random() * names.length)]);
      else if (type === 'email') items.push(`user${Math.floor(Math.random()*9999)}@example.com`);
      else if (type === 'city') items.push(cities[Math.floor(Math.random() * cities.length)]);
      else if (type === 'uuid') items.push(crypto.randomUUID());
      else if (type === 'color') items.push(`#${Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}`);
      else items.push(`item-${i}`);
    }
    showOutput('randomOutput', { type, count, data: items });
  }
}

// IP
async function getMyIP() {
  try { const d = await api('/ip'); showOutput('ipOutput', d); }
  catch(e) {
    // Fallback
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const j = await r.json();
      showOutput('ipOutput', j);
    } catch(x) { showOutput('ipOutput', null, 'Could not determine IP'); }
  }
}

// UA
async function parseUA() {
  const ua = getVal('uaInput') || navigator.userAgent;
  try {
    const d = await api(`/api/ua/parse?ua=${encodeURIComponent(ua)}`);
    showOutput('uaOutput', d);
  } catch(e) {
    showOutput('uaOutput', { 'user-agent': ua, note: 'Full parsing requires API connection' });
  }
}
