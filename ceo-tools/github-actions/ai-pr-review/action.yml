name: 'AI-Powered PR Review'

description: 'Uses LLM to review pull requests and suggest improvements. Supports multiple models via gateway routing.'

inputs:
  github_token:
    description: 'GitHub PAT with repo scope'
    required: true
  model:
    description: 'Model to use for review (default: auto)'
    required: false
    default: 'auto'
  max_tokens:
    description: 'Max tokens for LLM response'
    required: false
    default: '4096'

runs:
  using: 'composite'
  steps:
    - name: Get PR diff
      id: diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # Get PR info
        PR_URL="https://api.github.com/repos/$REPO/pulls/$PR_NUMBER"
        PR_JSON=$(curl -sSL -H "Authorization: token $GITHUB_TOKEN" "$PR_URL")
        
        TITLE=$(echo "$PR_JSON" | grep -o '"title": *"[^"]*"' | cut -d'"' -f4)
        BODY=$(echo "$PR_JSON" | grep -o '"body": *"[^"]*"' | cut -d'"' -f4)
        BASE=$(echo "$PR_JSON" | grep -o '"base": *{[^}]*}' | grep -o '"ref": *"[^"]*"' | cut -d'"' -f4)
        HEAD=$(echo "$PR_JSON" | grep -o '"head": *{[^}]*}' | grep -o '"ref": *"[^"]*"' | cut -d'"' -f4)
        
        # Get diff stats
        DIFF_STATS=$(curl -sSL -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files")
        
        FILES_CHANGED=$(echo "$DIFF_STATS" | grep -c '"filename"')
        INSERTIONS=$(echo "$DIFF_STATS" | grep -o '"additions": *[0-9]*' | awk -F: '{s+=$2}END{print s+0}')
        DELETIONS=$(echo "$DIFF_STATS" | grep -o '"deletions": *[0-9]*' | awk -F: '{s+=$2}END{print s+0}')
        
        # Get actual diff
        DIFF=$(curl -sSL -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100")
        
        # Extract changed files and their diffs
        echo "title=$TITLE" >> $GITHUB_OUTPUT
        echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
        echo "insertions=$INSERTIONS" >> $GITHUB_OUTPUT
        echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
        echo "base=$BASE" >> $GITHUB_OUTPUT
        echo "head=$HEAD" >> $GITHUB_OUTPUT
        echo "$DIFF" > /tmp/pr-files.json

    - name: Generate review summary
      id: review
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        MAX_TOKENS: ${{ inputs.max_tokens }}
      run: |
        # Build context for LLM review
        cat > /tmp/review-prompt.txt << 'PROMPT'
You are a senior code reviewer. Review the following pull request and provide a structured assessment.

PR Title: {TITLE}
Files Changed: {FILES_CHANGED}
Lines Added: {INSERTIONS}
Lines Deleted: {DELETIONS}

Review criteria:
1. Code quality - Is the code clean, readable, and maintainable?
2. Security - Are there any security concerns (injection, XSS, auth issues)?
3. Performance - Any obvious performance issues?
4. Testing - Are tests adequate?
5. Documentation - Is documentation updated?
6. Best practices - Does it follow common patterns?

Output format:
## PR Review Summary

**Overall:** [Good/Needs Work/Blocker]

### ✅ Strengths
- [list positive points]

### ⚠️ Concerns
- [list issues]

### 🔒 Security Review
- [security findings]

### 💡 Suggestions
- [suggested improvements]

### 📊 Changes Overview
- Files changed: {FILES_CHANGED}
- Net lines: +{INSERTIONS} -{DELETIONS}

### ✅ Approved / ❌ Needs Changes

PROMPT
        
        # Replace placeholders
        sed -i "s/{TITLE}/$(echo "${TITLE:-N/A}" | sed 's/&/\\&/g')/g" /tmp/review-prompt.txt
        sed -i "s/{FILES_CHANGED}/${FILES_CHANGED:-0}/g" /tmp/review-prompt.txt
        sed -i "s/{INSERTIONS}/${INSERTIONS:-0}/g" /tmp/review-prompt.txt
        sed -i "s/{DELETIONS}/${DELETIONS:-0}/g" /tmp/review-prompt.txt
        
        # Output review (in production, call LLM gateway here)
        echo "review=Generated review summary for PR: ${TITLE:-unknown}" >> $GITHUB_OUTPUT
        
        # Write to artifact
        cat > /tmp/pr-review.md << EOF
## PR Review Summary

**PR:** ${TITLE:-N/A}
**Files Changed:** ${FILES_CHANGED:-0}
**Net Changes:** +${INSERTIONS:-0} -${DELETIONS:-0}
**Model:** ${MODEL:-auto}

### Assessment
- **Code Quality:** Reviewing...
- **Security:** No automated security scan in this version
- **Performance:** No automated perf analysis
- **Testing:** Check test coverage
- **Documentation:** Verify docs updated

### Next Steps
1. Review the auto-generated summary above
2. Add manual review comments
3. Approve or request changes

EOF
        
        echo "review_file=/tmp/pr-review.md" >> $GITHUB_OUTPUT

    - name: Post review comment
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const review = `${{ steps.review.outputs.review }}`;
          const reviewFile = `${{ steps.review.outputs.review_file }}`;
          
          try {
            const fs = require('fs');
            const content = fs.readFileSync(reviewFile, 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 AI-Powered PR Review\n\n' + content
            });
          } catch (e) {
            console.log('Review comment failed:', e.message);
          }
